services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: pashurakshak
      POSTGRES_USER: pashu
      POSTGRES_PASSWORD: pashu_demo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://pashu:pashu_demo@postgres:5432/pashurakshak
    ports:
      - "8000:8000"
    depends_on:
      - postgres
  frontend:
    build: ./frontend
    ports:
      - "4173:80"
    depends_on:
      - backend
volumes:
  postgres_data:
